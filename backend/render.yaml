# Render Blueprint: run from repo root or point Render at this file.
# Docker context must be the repository root (parent of frontend/ and backend/).
services:
  - type: web
    name: renalbuddy
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile.production
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
