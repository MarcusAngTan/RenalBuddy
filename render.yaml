# Render Blueprint: one free web service + external TiDB Serverless (MySQL).
# Required: DATABASE_URL (TiDB). JWT_SECRET is generated. CORS adds RENDER_EXTERNAL_URL automatically in app code.
services:
  - type: web
    name: renalbuddy
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
