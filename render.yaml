# Render Blueprint: one free web service + external TiDB Serverless (MySQL).
# Set DATABASE_URL and CORS_ORIGINS in the dashboard after the first deploy URL is known.
services:
  - type: web
    name: renalbuddy
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
